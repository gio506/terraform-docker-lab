name: Terraform Docker Lab CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run terraform apply"
        required: false
        default: false
        type: boolean
      run_destroy:
        description: "Run terraform destroy after verify"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  tflint:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: tflint --init && tflint

  plan:
    runs-on: ubuntu-latest
    needs: tflint
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  apply_and_verify:
    if: github.event_name == 'workflow_dispatch' && inputs.run_apply == true
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
      - name: Terraform apply (manual only)
        run: terraform apply -auto-approve tfplan
      - name: Verify deployment
        run: ./scripts/verify.sh

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.run_apply == true && inputs.run_destroy == true
    runs-on: ubuntu-latest
    needs: apply_and_verify
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init
      - name: Terraform destroy (manual only)
        run: terraform destroy -auto-approve
