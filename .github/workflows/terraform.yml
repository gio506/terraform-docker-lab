name: Terraform Docker Lab CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run terraform apply"
        required: false
        default: false
        type: boolean
      run_destroy:
        description: "Run terraform destroy after verify"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-docker-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  structure-check:
    name: Stage 1 - Structure check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "CHEATSHEET.md"
            "FILES_EXPLAINED.md"
            "main.tf"
            "variables.tf"
            "outputs.tf"
            "versions.tf"
            "scripts/verify.sh"
            "scripts/simulate.sh"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required file: $file"
              exit 1
            }
          done

  fmt:
    name: Stage 2 - Terraform fmt
    runs-on: ubuntu-latest
    needs: structure-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform fmt -check -recursive

  validate:
    name: Stage 3 - Terraform validate
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  tflint:
    name: Stage 4 - TFLint
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: tflint --init && tflint

  plan:
    name: Stage 5 - Terraform plan
    runs-on: ubuntu-latest
    needs: tflint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  apply_and_verify:
    name: Stage 6 - Apply and verify
    if: github.event_name == 'workflow_dispatch' && inputs.run_apply == true
    runs-on: ubuntu-latest
    needs: plan
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
      - name: Terraform apply (manual only)
        run: terraform apply -auto-approve tfplan
      - name: Verify deployment
        run: ./scripts/verify.sh

  destroy:
    name: Stage 7 - Destroy
    if: github.event_name == 'workflow_dispatch' && inputs.run_apply == true && inputs.run_destroy == true
    runs-on: ubuntu-latest
    needs: apply_and_verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: terraform init
      - name: Terraform destroy (manual only)
        run: terraform destroy -auto-approve
